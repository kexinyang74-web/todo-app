<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- viewport：让手机按设备宽度显示，配合 CSS 做响应式 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的待办清单</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 整个应用的白色圆角卡片 -->
  <main class="app">

    <!-- 顶部标题 -->
    <header class="app-header">
      <h1>📝 我的待办清单</h1>
      <p class="subtitle">今天想完成哪些事？</p>
    </header>

    <!-- 输入区：输入框 + 优先级选择 + 添加按钮 -->
    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        placeholder="今天要做什么？"
        autocomplete="off"
        maxlength="100"
      />
      <select id="priority-select" class="priority-select" title="选择优先级">
        <option value="high">🔴 高</option>
        <option value="mid" selected>🟡 中</option>
        <option value="low">🟢 低</option>
      </select>
      <button type="submit" class="btn-add">➕ 添加任务</button>
    </form>

    <!-- 统计栏：显示已完成 / 未完成数量 + 清空已完成按钮 -->
    <div class="stats">
      <span id="stat-undone">未完成 0 项</span>
      <span class="stats-divider">·</span>
      <span id="stat-done">已完成 0 项</span>
      <button id="btn-clear-done" class="btn-clear">清空已完成</button>
      <button id="btn-clear-all" class="btn-clear btn-clear-all">全部清空</button>
    </div>

    <!-- 任务列表：由 JS 动态生成 <li> -->
    <ul id="todo-list" class="todo-list"></ul>

    <!-- 空状态提示：没有任务 / 全部完成时显示（文案由 JS 切换） -->
    <p id="empty-tip" class="empty-tip">暂无任务，添加一条试试吧 ✨</p>

  </main>

  <script src="script.js"></script>
</body>
</html>
